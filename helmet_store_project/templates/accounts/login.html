{% extends 'base.html' %}

{% block title %}Login - HelmetHub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 rounded-4 shadow-lg overflow-hidden">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-helmet-safety fa-3x mb-3" style="color: var(--primary);"></i>
                        <h3 class="fw-bold">Welcome Back</h3>
                        <p class="text-muted">Sign in to your HelmetHub account</p>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-user"></i></span>
                                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-hero w-100 py-3 mb-3">Sign In</button>
                    </form>
                    
                    <div class="text-center">
                        <p class="text-muted mb-0">Don't have an account? 
                            <a href="{% url 'accounts:register' %}" style="color: var(--primary); font-weight: 600;">Create one</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

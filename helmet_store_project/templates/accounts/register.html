{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Sign Up - HelmetHub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 rounded-4 shadow-lg overflow-hidden">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-plus fa-3x mb-3" style="color: var(--primary);"></i>
                        <h3 class="fw-bold">Create Account</h3>
                        <p class="text-muted">Join HelmetHub for exclusive deals</p>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-hero w-100 py-3 mt-3">Create Account</button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p class="text-muted mb-0">Already have an account? 
                            <a href="{% url 'accounts:login' %}" style="color: var(--primary); font-weight: 600;">Sign in</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
